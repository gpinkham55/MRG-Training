name: Build site

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Build pages
        run: python3 build.py
      - name: Commit rebuilt pages
        run: |
          git config user.name "site-builder"
          git config user.email "site-builder@users.noreply.github.com"
          git add *.html
          git diff --cached --quiet || (git commit -m "Rebuild pages" && git push)
